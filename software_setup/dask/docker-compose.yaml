services:
  # ... (Your HDFS/Spark services go here) ...
  # Assuming your HDFS NameNode service is named 'namenode' and listens on port 9000

  # --- DASK SERVICES START ---
  dask-jupyter:
    image: daskdev/dask-notebook:latest
    profiles:
      - tools
    container_name: dask-jupyter
    hostname: dask-jupyter
    depends_on:
      - dask-scheduler
    networks:
      - sar_shared_network

    ports:
      - "8888:8888"
    volumes:
      - /home/btcchl0040/Documents/summer-project-codes/bigdata-proj-backend/sar_pipeline/dask:/workspace
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--no-browser", "--allow-root"]


  dask-scheduler:
    # Use the custom image built from the Dockerfile.dask
    image: custom-dask-hdfs:latest
    user: "1000:1000"
    build:
      context: .
      dockerfile: Dockerfile.dask
    container_name: dask-scheduler
    hostname: dask-scheduler
    ports:
      - "8786:8786" # Scheduler port
      - "8787:8787" # Dashboard port (changed to default 8787 for consistency)
    networks:
      - sar_shared_network
    command: ["dask-scheduler"]
    volumes:
      - /home/btcchl0040/Documents/summer-project/dask_shared:/opt/shared/data
      - /home/btcchl0040/Documents/SAR_Data:/opt/spark/data
      - /home/btcchl0040/Documents/summer-project-codes/bigdata-proj-backend/sar_pipeline/jobs:/opt/spark-jobs

  dask-worker-1:
    image: custom-dask-hdfs:latest
    user: "1000:1000"
    container_name: dask-worker-1
    hostname: dask-worker-1
    depends_on:
      - dask-scheduler
    networks:
      - sar_shared_network
    command: ["dask-worker", "dask-scheduler:8786", "--nthreads", "4", "--memory-limit", "8GB"]
    volumes:
      - /home/btcchl0040/Documents/summer-project/dask_shared:/opt/shared/data
      - /home/btcchl0040/Documents/SAR_Data:/opt/spark/data
      - /home/btcchl0040/Documents/summer-project-codes/bigdata-proj-backend/sar_pipeline/jobs:/opt/spark-jobs

  dask-worker-2:
    image: custom-dask-hdfs:latest
    user: "1000:1000"
    container_name: dask-worker-2
    hostname: dask-worker-2
    depends_on:
      - dask-scheduler
    networks:
      - sar_shared_network
    command: ["dask-worker", "dask-scheduler:8786", "--nthreads", "4", "--memory-limit", "8GB"]
    volumes:
      - /home/btcchl0040/Documents/summer-project/dask_shared:/opt/shared/data
      - /home/btcchl0040/Documents/SAR_Data:/opt/spark/data
      - /home/btcchl0040/Documents/summer-project-codes/bigdata-proj-backend/sar_pipeline/jobs:/opt/spark-jobs

  
  dask-client:
    # Use the custom image and remove the runtime 'pip install'
    image: custom-dask-hdfs:latest
    user: "1000:1000"
    build:
      context: .
      dockerfile: Dockerfile.dask
    container_name: dask-client
    hostname: dask-client
    depends_on:
      - dask-scheduler
    networks:
      - sar_shared_network
    volumes:
      - /home/btcchl0040/Documents/summer-project-codes/bigdata-proj-backend/sar_pipeline/dask:/opt/shared/data:z # Mount your job directory here
      - /home/btcchl0040/Documents/SAR_Data:/opt/spark/data
      - /home/btcchl0040/Documents/summer-project-codes/bigdata-proj-backend/sar_pipeline/jobs:/opt/spark-jobs
    environment:
      # This is now redundant but harmless, as the Client('dask-scheduler:8786') is best practice
      - DASK_SCHEDULER=dask-scheduler:8786 
    # Simple command since packages are pre-installed
    command: ["sleep", "infinity"]

networks:
  sar_shared_network:
    external: true
